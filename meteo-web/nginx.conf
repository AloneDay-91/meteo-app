server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies to the meteo-serveur container once meteo-web/src/lib/api.ts
    # is switched from mock data to real fetch("/api/latest") calls.
    location /api/ {
        proxy_pass http://meteo-serveur:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
